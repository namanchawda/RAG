version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sec_rag_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sec_rag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
    - "5433:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sec_rag"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgvector_data:
